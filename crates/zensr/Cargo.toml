[package]
name = "zensr"
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
publish = false
description = "Codec-independent artifact restoration, learned routing and coefficient constraints"

[dependencies]
zensr-micro = { path = "../zensr-micro", default-features = false }
zenanalyze = { version = "0.2.0", optional = true, features = ["api"] }
zenanalyze-api = { version = "0.1.0", optional = true }

[features]
default = ["chooser"]
chooser = ["dep:zenanalyze", "dep:zenanalyze-api"]
