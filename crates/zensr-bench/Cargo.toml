[package]
name = "zensr-bench"
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
publish = false

[dependencies]
zenanalyze = { git = "https://github.com/imazen/zenanalyze", rev = "a7d8224" }
tract-onnx = "0.23.4"
zensr-micro = { path = "../zensr-micro", features = ["internals"] }
zensr-zenjpeg = { path = "../zensr-zenjpeg" }
zenpixels = "0.2.14"
zenpng = "0.1.4"
# zenjpeg 0.9.0 is not published yet and 0.8.4 keeps DeblockMode pub(crate),
# so this pins the public repo. Swap to a version req when 0.9.0 ships.
# Local sibling tree wins via the gitignored .cargo override: just cargo-local
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "e277e9c9" }
zenresize = "0.3.1"
fast-ssim2 = { version = "0.8.2", features = ["imgref"] }
butteraugli = "0.9.3"
imgref = "1.12.2"
bytemuck = "1.25.2"
enough = "0.4.4"
rgb = "0.8.52"
zensim = "0.2.7"

[features]
default = ["avx512"]
avx512 = ["zensr-micro/avx512"]
