[package]
name = "zensr-bench"
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
publish = false

[dependencies]
# Dev tooling (bench/probe binaries) may depend on a concrete zenanalyze — it is
# not in the product graph. Registry version + the workspace-root patch, so it
# still resolves the same source as everything else.
zenanalyze = { version = "0.2.0", features = ["api"] }
tract-onnx = "0.23.4"
zensr-micro = { path = "../zensr-micro", features = ["internals"] }
# `chooser` pulls zenanalyze in — needed by content_probe, which measures the
# chooser against the coefficient-domain detector.
zensr-zenjpeg = { path = "../zensr-zenjpeg", features = ["chooser"] }
zenpixels = ">=0.2.14, <0.4.0"
zenpng = "0.1.4"
# zenjpeg 0.9.0 is not published yet and 0.8.4 keeps DeblockMode pub(crate),
# so this pins the public repo. Swap to a version req when 0.9.0 ships.
# Local sibling tree wins via the gitignored .cargo override: just cargo-local
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "e277e9c9" }
# HEIC decode for the clean-reference corpus: 90 of the corpus's photographic
# sources are HEIC, and they are the CHEAP clean references — decode and they
# are pristine, no downscale-to-pristine treatment needed. Git-pinned because
# the API used here (`DecoderConfig::decode(.., PixelLayout::Rgb8)`) is 0.2.0
# and crates.io is still on 0.1.6; drop the pin when 0.2 publishes.
# The default feature set is empty by design — a backend must be named.
heic = { git = "https://github.com/imazen/heic", rev = "9e7f75617fb1e62e642ee34ee1ac21a5f068ab51", default-features = false, features = ["backend-rust", "std"] }
zenresize = "0.3.1"
fast-ssim2 = { version = "0.8.2", features = ["imgref"] }
butteraugli = "0.9.3"
imgref = "1.12.2"
bytemuck = "1.25.2"
enough = "0.4.4"
rgb = "0.8.52"
zensim = "0.2.7"
rayon = "1.11.1"

[features]
default = ["avx512"]
avx512 = ["zensr-micro/avx512"]
