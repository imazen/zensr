[package]
name = "zensr-bench"
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
publish = false

[dependencies]
zenanalyze = { path = "../../../zenanalyze" }
tract-onnx = "0.23.4"
zensr-micro = { path = "../zensr-micro", features = ["internals"] }
zensr-zenjpeg = { path = "../zensr-zenjpeg" }
zenpixels = "0.2.14"
zenpng = "0.1.4"
# >=0.8.4 resolves 0.8.4 from crates.io normally; the gitignored .cargo
# config patches in the local 0.9.0 tree (zjtool needs its DeblockMode
# export — pub(crate)-locked in 0.8.4). Regenerate: just cargo-local
zenjpeg = ">=0.8.4, <0.10"
zenresize = "0.3.1"
fast-ssim2 = { version = "0.8.2", features = ["imgref"] }
butteraugli = "0.9.3"
imgref = "1.12.2"
bytemuck = "1.25.2"
enough = "0.4.4"
rgb = "0.8.52"
zensim = "0.2.7"

[features]
default = ["avx512"]
avx512 = ["zensr-micro/avx512"]
