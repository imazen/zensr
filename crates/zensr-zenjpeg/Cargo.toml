[package]
name = "zensr-zenjpeg"
version = "0.1.0"
edition = "2021"
description = "zenjpeg integration for zensr: probe-driven decode policy, restoration pipeline, quantization-consistency projection"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"

[dependencies]
zenanalyze = { path = "../../../zenanalyze", optional = true }
# >=0.8.4 resolves from crates.io; the gitignored .cargo config patches the
# local 0.9 tree (DeblockMode export + shipping decoder). just cargo-local
zenjpeg = ">=0.8.4, <0.10"
zensr-micro = { path = "../zensr-micro" }
enough = "0.4.4"

[dev-dependencies]
rgb = "0.8.52"
bytemuck = "1.25.2"

[features]
chooser = ["dep:zenanalyze"]
