[package]
name = "zensr-zenjpeg"
version = "0.1.0"
edition = "2021"
description = "zenjpeg integration for zensr: probe-driven decode policy, restoration pipeline, quantization-consistency projection"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"

[dependencies]
# The version-unifying feature contract, and this crate's INTERCHANGE BOUNDARY:
# the chooser takes an `Offer` / `&dyn FeatureProvider`, so a host on any
# `zenanalyze` version can drive it. See `docs/sole-contract.md` in
# imazen/zenanalyze.
#
# A crates.io VERSION, never a git rev: Cargo unifies by source, so a rev pin is
# its own source and two consumers on different revs get two incompatible `Offer`
# types. Unreleased changes come in through the single workspace-root
# [patch.crates-io].
zenanalyze-api = { version = "0.1.0", optional = true }
# zenanalyze backs `chooser-bundled`, supplying `zenanalyze::Analyzer` as a
# default `FeatureProvider` so callers don't have to plumb one. A direct dep like
# this is explicitly PERMITTED — a codec that needs features the host didn't
# provide should re-analyse — and is optional here only because the chooser
# genuinely doesn't need it when an offer is supplied.
zenanalyze = { version = "0.2.0", optional = true, features = ["api"] }
# zenjpeg 0.9.0 is not published yet and 0.8.4 keeps DeblockMode pub(crate),
# so this pins the public repo. Swap to a version req when 0.9.0 ships.
# Local sibling tree wins via the gitignored .cargo override: just cargo-local
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "e277e9c9" }
zensr-micro = { path = "../zensr-micro" }
enough = "0.4.4"

[dev-dependencies]
rgb = "0.8.52"
bytemuck = "1.25.2"

[features]
# Content-class chooser through the `zenanalyze-api` contract: reads feature
# values out of an `Offer`, or extracts via a `&dyn FeatureProvider` the caller
# supplies. No `zenanalyze` dependency, so it builds anywhere.
chooser = ["dep:zenanalyze-api"]
# `chooser` plus a bundled default provider (`zenanalyze::Analyzer`), which keeps
# the zero-argument `classify_rgb8` entry working with no caller plumbing —
# zensr picking an analyzer version on the caller's behalf.
chooser-bundled = ["chooser", "dep:zenanalyze"]
