[package]
name = "zensr-micro"
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
publish = false

[dependencies]
archmage = "0.9.28"
magetypes = { version = "0.9.28", features = ["std"], default-features = false }
zenpixels = { version = "0.2.14", optional = true }
bytemuck = { version = "1.25.2", optional = true }

[features]
internals = []
default = ["avx512"]
# zenpixels-typed API (PixelSlice in, PixelBuffer out)
px = ["dep:zenpixels", "dep:bytemuck"]
avx512 = ["magetypes/avx512"]
# AVX-512-baseline-without-v4x CPUs (Skylake-X era) get their own f32x16 tier.
# Off by default: they fall back to v3/AVX2, saving ~50KB of duplicate kernels.
tier_v4 = ["avx512"]
nan-debug = []

[[bin]]
name = "zensr-verify"
path = "src/bin/zensr-verify.rs"
required-features = ["internals"]

[dev-dependencies]
# First ARM tier measurement for this crate (2026-08-01). `testable_dispatch`
# lets benches/kernel_tiers.rs disable the baseline SIMD token so the NEON
# kernels can be compared against a real forced-scalar arm.
zenbench = "0.1.9"
archmage = { version = "0.9.28", features = ["testable_dispatch"] }

[[bench]]
name = "kernel_tiers"
harness = false
# The bench reaches into the SIMD kernels, which are crate-private
# without this feature — without the gate `cargo build --all-targets`
# fails on default features.
required-features = ["internals"]
