[package]
name = "zensr-gpu-spike"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
cubecl = { package = "zenforks-cubecl", version = "0.10.1", default-features = false, features = ["std"] }

[features]
cuda = ["cubecl/cuda"]
wgpu = ["cubecl/wgpu"]

[[bin]]
name = "gpu_spike"
path = "src/main.rs"
