[package]
name = "zensr-candidate-bank"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
[workspace]
[features]
default = ["avx512"]
avx512 = ["archmage/avx512", "magetypes/avx512"]
[dependencies]
zenpredict = { git = "https://github.com/imazen/zenanalyze", rev = "0bc01d3f4d366029d8103fc3e5fc4341f4fce012", default-features = false, features = ["std", "simd"] }
zenpredict-bake = { git = "https://github.com/imazen/zenanalyze", rev = "0bc01d3f4d366029d8103fc3e5fc4341f4fce012" }
# NOTE: imij 0f74449b (first zqi rev on archmage 0.9.33) pulls git zencodec 119f3133
# (needs zenpixels 3286169c SampleStorage), while zenanalyze 615a709a (FEATURE_DEFS_VERSION 1)
# needs zenpixels e5112d5f (pre-df9a8eb). Once zensr routers rebake for zenanalyze v2 and
# zenpixels 3286169c+, bump [patch.crates-io] here and migrate imij::encode -> ImiEncoderConfig.
imij = { git = "https://github.com/imazen/zqi", rev = "0f74449bdef14a30a25d82d39cfb59b2e98b71e0", default-features = false, features = ["std", "encode", "extended"] }
imij-set = { git = "https://github.com/imazen/zqi", rev = "0f74449bdef14a30a25d82d39cfb59b2e98b71e0" }
zensr-micro = { path = "../../crates/zensr-micro" }
zensr-zenjpeg = { path = "../../crates/zensr-zenjpeg" }
zenanalyze = { version = "0.2.0", features = ["api"] }
zenanalyze-api = "0.1.0"
fast-ssim2 = { version = "0.8.2", features = ["imgref"] }
zensim = { git = "https://github.com/imazen/zensim", rev = "6060039d8c0ace71d47c722ea76233bb2d745a22", default-features = false, features = ["avx512"] }
zenresize = "=0.3.1"
zenpng = { version = "=0.1.4", default-features = false }
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "d566cba713522689c4940da7d24caeb09b01d05c" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.1"
enough = "0.4.4"
rgb = "0.8.52"
imgref = "1.12.2"
archmage = { version = "0.9.33", features = ["macros"] }
magetypes = "0.9.33"
rayon = "1.11.1"
[profile.release]
lto = "thin"
[patch.crates-io]
how-far = { git = "https://github.com/imazen/how-far", rev = "571bf1a2fc92e5b99c3777f8ff81bafab7666a75" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "e5112d5f0070aa7dda0d376bb867d3cdd1626410" }
zenanalyze = { git = "https://github.com/imazen/zenanalyze", rev = "615a709a5257a7a1855bf5fedac039100053d335" }
zenanalyze-api = { git = "https://github.com/imazen/zenanalyze", rev = "615a709a5257a7a1855bf5fedac039100053d335" }
# zenjpeg d566cba7 (PR #261 / zensr-decoder-integration) paired with zencodec 61fb96f1
# and zenpixels e5112d5f (dependency patches do not propagate).
zencodec = { git = "https://github.com/imazen/zencodec", rev = "61fb96f1c8c89d4c8d2210eed8679372d66f8aa7" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "61fb96f1c8c89d4c8d2210eed8679372d66f8aa7" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "e5112d5f0070aa7dda0d376bb867d3cdd1626410" }
zenpixels-v02 = { package = "zenpixels", git = "https://github.com/imazen/zenpixels", rev = "789d69dbc314e748676b7f2f19542c17473ba40b" }
