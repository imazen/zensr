[package]
# Match the existing runtime edition because runtime_unit uses its crate root.
name = "zensr-coz-profile"
version = "0.0.0"
edition = "2021"
publish = false

# Keep profiling independent of the benchmark workspace's codec dependencies.
[workspace]

[dependencies]
coz = "0.1.3"
archmage = { version = "0.9.29", features = ["testable_dispatch"] }
magetypes = { version = "0.9.29", default-features = false, features = ["std"] }
zensr-micro = { path = "../../crates/zensr-micro" }

# Match the runtime workspace's unpublished concat_shift implementation.
[patch.crates-io]
archmage = { git = "https://github.com/imazen/archmage", rev = "f46cf941661e0befa47fb7dc2fb9147239062325" }
magetypes = { git = "https://github.com/imazen/archmage", rev = "f46cf941661e0befa47fb7dc2fb9147239062325" }
archmage-macros = { git = "https://github.com/imazen/archmage", rev = "f46cf941661e0befa47fb7dc2fb9147239062325" }

[profile.release]
debug = 1
lto = "thin"

# Compile the real runtime crate root as this tool's test target. This runs
# its existing unit tests without resolving unrelated codec workspace members.
[[test]]
name = "runtime_unit"
path = "../../crates/zensr-micro/src/lib.rs"

[dev-dependencies]
archmage = { version = "0.9.29", features = ["testable_dispatch"] }

[features]
default = ["avx512"]
avx512 = ["zensr-micro/avx512", "magetypes/avx512"]
internals = ["zensr-micro/internals"]
tier_v4 = ["avx512", "zensr-micro/tier_v4"]
nan-debug = ["zensr-micro/nan-debug"]

# These are existing runtime cfg names, deliberately unavailable as tool
# features. In particular, this tool cannot enable unsafe experiments.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("px", "unsafe-experiments"))'] }
