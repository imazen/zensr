[package]
name = "zensr-browser-repair"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
[workspace]
[lib]
crate-type = ["cdylib"]
[dependencies]
wasm-bindgen = "=0.2.129"
enough = "0.4.4"
zensr = { git = "https://github.com/imazen/zensr", rev = "0bb29cf63a4ab8fa8864994acc659e61c890c5e6" }
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "d566cba713522689c4940da7d24caeb09b01d05c", features = ["restoration", "moxcms"] }
[patch.crates-io]
zenanalyze = { git = "https://github.com/imazen/zenanalyze", rev = "615a709a5257a7a1855bf5fedac039100053d335" }
zenanalyze-api = { git = "https://github.com/imazen/zenanalyze", rev = "615a709a5257a7a1855bf5fedac039100053d335" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "61fb96f1c8c89d4c8d2210eed8679372d66f8aa7" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "61fb96f1c8c89d4c8d2210eed8679372d66f8aa7" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "e5112d5f0070aa7dda0d376bb867d3cdd1626410" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "e5112d5f0070aa7dda0d376bb867d3cdd1626410" }
[features]
strict-fma = ["zensr/strict-fma"]

[profile.release]
lto = "thin"
opt-level = 3
