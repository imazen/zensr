[workspace]
resolver = "2"
members = ["crates/zensr-bench", "crates/zensr-micro", "crates/zensr-micro-abi", "crates/zensr-zenjpeg", "crates/zensr-gpu-spike"]

[profile.release]
lto = "thin"

# Size-probe profile for the micro-abi cdylib.
[profile.release-min]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Speed build for the micro kernels (autovectorization needs opt3).
[profile.release-fast]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1

# zenanalyze 0.2.x and the zenanalyze-api additions this graph needs
# (FeatureProvider, Select::Names) are on `main` but not yet on crates.io. ONE
# patch at the workspace root rewrites every registry edge — including
# zenanalyze's own internal `{ version, path }` dep on the contract — so the
# whole graph resolves a single zenanalyze and a single zenanalyze-api. Never
# re-pin these as per-manifest git revs: Cargo unifies by source, so a rev pin is
# its own source and consumers on different revs get incompatible `Offer` types.
# Drop both entries once zenanalyze 0.2.x / zenanalyze-api 0.1.1 publish.
[patch.crates-io]
zenanalyze = { git = "https://github.com/imazen/zenanalyze" }
zenanalyze-api = { git = "https://github.com/imazen/zenanalyze" }
# conv3x3 calls magetypes' `concat_shift`, which is on imazen/archmage#111 and
# unpublished. Pinned to the exact rev rather than the branch so the tree builds
# the same bytes tomorrow. Drop all three lines and let the 0.9.30 crates.io
# release satisfy the dependency once #111 ships.
archmage = { git = "https://github.com/imazen/archmage", rev = "f46cf941661e0befa47fb7dc2fb9147239062325" }
magetypes = { git = "https://github.com/imazen/archmage", rev = "f46cf941661e0befa47fb7dc2fb9147239062325" }
archmage-macros = { git = "https://github.com/imazen/archmage", rev = "f46cf941661e0befa47fb7dc2fb9147239062325" }
