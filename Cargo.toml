[workspace]
resolver = "2"
members = ["crates/zensr", "crates/zensr-bench", "crates/zensr-micro", "crates/zensr-micro-abi", "crates/zensr-zenjpeg", "crates/zensr-gpu-spike"]

[profile.release]
lto = "thin"

# Size-probe profile for the micro-abi cdylib.
[profile.release-min]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Speed build for the micro kernels (autovectorization needs opt3).
[profile.release-fast]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1

# zenanalyze 0.2.x and the zenanalyze-api additions this graph needs
# (FeatureProvider, Select::Names) are on `main` but not yet on crates.io. ONE
# patch at the workspace root rewrites every registry edge — including
# zenanalyze's own internal `{ version, path }` dep on the contract — so the
# whole graph resolves a single zenanalyze and a single zenanalyze-api. Never
# re-pin these as per-manifest git revs: Cargo unifies by source, so a rev pin is
# its own source and consumers on different revs get incompatible `Offer` types.
# Drop both entries once zenanalyze 0.2.x / zenanalyze-api 0.1.1 publish.
[patch.crates-io]
zenanalyze = { git = "https://github.com/imazen/zenanalyze" }
zenanalyze-api = { git = "https://github.com/imazen/zenanalyze" }
# zenjpeg 24b6d3fb (PR #253, the APP10 encode record) needs the zencodec 0.2
# family and a zenpixels rev that are not on crates.io yet; this mirrors
# zenjpeg's own patch table (dependency patches do not propagate). Drop when
# those publish. zenanalyze keeps crates.io zencodec 0.1 — different major.
zencodec = { git = "https://github.com/imazen/zencodec", rev = "61fb96f1c8c89d4c8d2210eed8679372d66f8aa7" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "61fb96f1c8c89d4c8d2210eed8679372d66f8aa7" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "f23ac7535be1144a22d0dc6b71f866a08b151f34" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "f23ac7535be1144a22d0dc6b71f866a08b151f34" }
