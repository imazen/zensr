name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  # Only the restoration crates. zensr-bench is a measurement harness: it links
  # AGPL metric crates, shells out to cjpeg/cjpegli, and needs a corpus that is
  # not distributed, so building it here would test the runner's tooling rather
  # than this code.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-26-intel
          - windows-latest
          - windows-11-arm
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test (default features)
        run: cargo test -p zensr-micro -p zensr-zenjpeg

      - name: Test (no default features)
        run: cargo test -p zensr-micro --no-default-features

      # `internals` exposes the SIMD kernels and their equivalence tests — the
      # ones that would catch a per-tier divergence, so they must actually run.
      - name: Test (internals)
        run: cargo test -p zensr-micro --features internals

      - name: Test (px)
        run: cargo test -p zensr-micro --features px,internals

      - name: Test (chooser)
        run: cargo test -p zensr-zenjpeg --features chooser

  # 32-bit is a primary target: it catches pointer-width assumptions in the
  # kernels and keeps the wasm story honest.
  i686:
    name: Test (i686-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        run: cargo install cross --locked
      - name: Test
        run: cross test --target i686-unknown-linux-gnu -p zensr-micro -p zensr-zenjpeg

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p zensr-micro -p zensr-zenjpeg --all-targets -- -D warnings
      - name: Clippy (internals)
        run: cargo clippy -p zensr-micro --features internals,px --all-targets -- -D warnings
