name: CI

on:
  push:
    branches: [main]
    # A documentation-only push cannot change what the code does. GitHub skips
    # the run only when EVERY changed path matches, so a commit touching both
    # docs and code still builds.
    paths-ignore: ['**.md', 'benchmarks/**', 'eval_split/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'benchmarks/**', 'eval_split/**']

concurrency:
  # Keyed on the ref, NOT run_id: run_id is unique per run, so the group never
  # matched and superseded runs piled up in the queue instead of cancelling.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  browser-unit:
    name: Browser tile and memory contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Tile coverage and allocation bounds
        run: node --test tools/browser-demo/core.test.mjs tools/browser-demo/budgets.test.mjs tools/browser-demo/pool-plan.test.mjs tools/browser-demo/repair-runtime.test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Browser WASM glue compiles
        shell: bash
        run: |
          export RUSTFLAGS='-C target-feature=+simd128'
          for module in codec repair; do
            cargo check --locked --target wasm32-unknown-unknown --manifest-path "tools/browser-demo/$module/Cargo.toml"
          done

  # Only the restoration crates. zensr-bench is a measurement harness: it links
  # AGPL metric crates, shells out to cjpeg/cjpegli, and needs a corpus that is
  # not distributed, so building it here would test the runner's tooling rather
  # than this code.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
          - windows-11-arm
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Artifact writer atomic publication
        shell: bash
        run: |
          export TMPDIR="$HOME/tmp/routing-storage-ci"
          mkdir -p "$TMPDIR"
          rustc --edition 2024 --test tools/test_routing_storage.rs -o "$TMPDIR/routing-storage-tests.exe"
          "$TMPDIR/routing-storage-tests.exe"

      - name: Test (default features)
        run: cargo test -p zensr -p zensr-micro -p zensr-zenjpeg

      - name: Test (no default features)
        run: cargo test -p zensr-micro --no-default-features

      # `internals` exposes the SIMD kernels and their equivalence tests — the
      # ones that would catch a per-tier divergence, so they must actually run.
      - name: Test (internals)
        run: cargo test -p zensr-micro --features internals

      - name: Test (px)
        run: cargo test -p zensr-micro --features px,internals

      # One flag, one configuration. `chooser` pulls both zenanalyze-api (the
      # boundary types every public chooser signature names) and zenanalyze (what
      # `classify_rgb8` scans with when no offer was handed in), so this single
      # step compiles the code AND runs the behavioural tests.
      #
      # This used to be two steps, `chooser` and `chooser-bundled`. The split was
      # removed 2026-08-30: the first was a green step that tested nothing (the
      # behavioural tests were all gated behind the second flag), and the
      # configuration it protected — "chooser without zenanalyze" — was one
      # nobody shipped.
      - name: Test (chooser — contract boundary + behavioural rule)
        run: cargo test -p zensr-zenjpeg --features chooser

  # 32-bit is a primary target: it catches pointer-width assumptions in the
  # kernels and keeps the wasm story honest.
  i686:
    name: Test (i686-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        run: cargo install cross --locked
      - name: Test
        run: cross test --target i686-unknown-linux-gnu -p zensr -p zensr-micro -p zensr-zenjpeg

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Routing calibration integrity
        run: |
          python3 -m unittest discover -s tools -p 'test_*canon4*.py'
          python3 -m unittest discover -s tools -p 'test_routing_frontier.py'
      - name: Publication routing analysis integrity
        run: |
          mkdir -p "$HOME/tmp/publication-routing-ci"
          export TMPDIR="$HOME/tmp/publication-routing-ci"
          python3 -m venv .venv-routing-ci
          .venv-routing-ci/bin/python -m pip install -r tools/publication-routing-requirements.txt
          .venv-routing-ci/bin/python -m unittest discover -s tools -p 'test_publication_routing.py'
          .venv-routing-ci/bin/python -m unittest discover -s tools -p 'test_publication_retention.py'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p zensr-micro -p zensr-zenjpeg --all-targets -- -D warnings
      - name: Clippy (internals)
        run: cargo clippy -p zensr-micro --features internals,px --all-targets -- -D warnings

  qat:
    name: Canon4 QAT and packed-weight checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Isolated CPU training-tool dependencies
        run: |
          python3 -m venv .venv-qat-ci
          .venv-qat-ci/bin/python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          .venv-qat-ci/bin/python -m pip install numpy==2.5.2
      - name: QAT gradient, golden and serialization checks
        run: |
          mkdir -p "$HOME/tmp/qat-ci"
          export TMPDIR="$HOME/tmp/qat-ci"
          export OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2
          .venv-qat-ci/bin/python -m unittest discover -s tools -p test_qat.py
          .venv-qat-ci/bin/python -m unittest discover -s tools -p test_qat_report.py
          .venv-qat-ci/bin/python -m unittest discover -s tools -p test_quality_int8_report.py

  qat-runtime:
    name: QAT portable decoder and artifact storage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/qat/runtime -> target
      - name: Exact packed layout and storage regression tests
        run: |
          mkdir -p "$HOME/tmp/qat-runtime-ci"
          export TMPDIR="$HOME/tmp/qat-runtime-ci"
          cargo test --release --locked --manifest-path tools/qat/runtime/Cargo.toml
      - name: QAT runtime lint
        run: cargo clippy --locked --manifest-path tools/qat/runtime/Cargo.toml --all-targets -- -D warnings

  quality-int8-runtime:
    name: Quality model integer comparison tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/quality-int8/runtime -> target
      - name: Threaded confirmation context regression checks
        run: cargo test --locked --manifest-path tools/quality-int8/runtime/Cargo.toml --bin scaling
      - name: Lossless SR image retention and atomic publication
        run: cargo test --locked --manifest-path tools/quality-int8/runtime/Cargo.toml --bin superres
      - name: External-model harm boundary regressions
        run: python3 -m unittest discover -s tools/external-models -p 'test_*.py'
      - name: Compile and lint every comparison executable
        run: cargo clippy --locked --manifest-path tools/quality-int8/runtime/Cargo.toml --all-targets -- -D warnings
